<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helix Core Academy — Học & luyện Perforce cho Unreal Engine</title>
  <meta name="description" content="Nền tảng học tập nội bộ giúp bạn thành thạo Helix Core (Perforce) cho studio game Unreal Engine: bài học, quiz, bài tập tình huống và ôn tập lặp lại ngắt quãng." />
  <meta name="author" content="ReiX Labs" />
  <meta name="generator" content="ReiX Labs" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" type="image/png" href="assets/img/reix-favicon.png" />
  <link rel="apple-touch-icon" href="assets/img/reix-favicon.png" />
</head>
<body>
  <!-- Thanh bên trái: điều hướng + cây bài học -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand__mark">🧬</span>
      <div class="brand__text">
        <strong>Helix Core</strong>
        <span>Academy</span>
      </div>
    </div>

    <nav class="nav" id="mainNav">
      <a class="nav__item" data-route="dashboard" href="#/dashboard">
        <span class="nav__icon">🏠</span><span>Trang chủ</span>
      </a>
      <a class="nav__item" data-route="review" href="#/review">
        <span class="nav__icon">🔁</span><span>Luyện tập hàng ngày</span>
        <span class="nav__badge" id="reviewBadge" hidden>0</span>
      </a>
      <a class="nav__item" data-route="learn" href="#/learn">
        <span class="nav__icon">📚</span><span>Lộ trình học</span>
      </a>
      <a class="nav__item" data-route="practice" href="#/practice">
        <span class="nav__icon">🎯</span><span>Luyện tập & Quiz</span>
      </a>
      <a class="nav__item" data-route="progress" href="#/progress">
        <span class="nav__icon">📊</span><span>Tiến độ & Huy hiệu</span>
      </a>
    </nav>

    <div class="sidebar__tree" id="sidebarTree">
      <div class="sidebar__label">Bài học theo nhóm</div>
      <div id="moduleTree" class="module-tree"></div>
    </div>

    <div class="sidebar__foot">
      <div class="side-progress">
        <div class="side-progress__row">
          <span>Tiến độ khoá học</span>
          <span id="overallPct">0%</span>
        </div>
        <div class="progress"><div class="progress__bar" id="overallBar" style="width:0%"></div></div>
      </div>
    </div>
  </aside>

  <!-- Thanh trên cùng: tìm kiếm + trạng thái -->
  <header class="topbar">
    <button class="topbar__menu" id="menuToggle" aria-label="Menu">☰</button>

    <div class="search" id="search">
      <span class="search__icon">🔍</span>
      <input class="search__input" id="globalSearch" type="text" autocomplete="off"
             placeholder="Tìm bài học, khái niệm…" />
      <kbd class="search__kbd">Ctrl K</kbd>
      <div class="search__panel" id="searchPanel" hidden></div>
    </div>

    <div class="topbar__stats">
      <div class="stat-pill" title="Chuỗi ngày học liên tục">
        <span class="stat-pill__icon">🔥</span>
        <span class="stat-pill__value" id="streakValue">0</span>
      </div>
      <div class="stat-pill stat-pill--due" id="duePill" title="Thẻ cần ôn hôm nay" hidden>
        <span class="stat-pill__icon">🃏</span>
        <span class="stat-pill__value" id="dueValue">0</span>
      </div>
      <div class="level-pill" id="levelPill" title="Cấp độ & kinh nghiệm">
        <div class="level-pill__ring" id="levelRing"></div>
        <div class="level-pill__text">
          <strong id="levelValue">Lv.1</strong>
          <span id="xpValue">0 XP</span>
        </div>
      </div>
      <button class="icon-btn" id="themeToggle" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện">🌙</button>
    </div>
  </header>

  <!-- Vùng nội dung chính -->
  <main class="main" id="view">
    <div class="loading">
      <div class="spinner"></div>
      <p>Đang tải tài liệu…</p>
    </div>
  </main>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <script type="module" src="assets/js/app.js"></script>

  <!-- ============================================================
       Sản phẩm thuộc sở hữu của team ReiX Labs · © ReiX Labs
       Vui lòng không sao chép/tái phân phối khi chưa được phép.
       ============================================================ -->
  <style>
    .reix-credit{position:fixed;right:14px;bottom:14px;z-index:2147483000;display:flex;align-items:center;gap:9px;
      padding:6px 13px;border-radius:14px;background:rgba(255,255,255,.82);
      box-shadow:0 3px 14px rgba(30,20,70,.22);border:1px solid rgba(90,58,166,.20);
      text-decoration:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
      transition:transform .15s ease,box-shadow .15s ease}
    .reix-credit:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(30,20,70,.32)}
    .reix-credit__by{font:600 11px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#6b5aa0;letter-spacing:.03em;white-space:nowrap}
    .reix-credit img{height:32px;width:auto;display:block}
    @media (max-width:640px){.reix-credit__by{display:none}.reix-credit{padding:5px 9px;right:10px;bottom:10px}.reix-credit img{height:26px}}
  </style>
  <a class="reix-credit" href="https://github.com/Rei-1407" target="_blank" rel="noopener"
     title="Sản phẩm của team ReiX Labs" aria-label="Sản phẩm của team ReiX Labs">
    <span class="reix-credit__by">Made by</span>
    <img src="assets/img/reix-logo.png" alt="ReiX Labs" />
  </a>
</body>
</html>
